<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>chikpixels</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" hidden style="max-width:520px;margin:0 auto;padding:24px 16px;font-family:'Roboto Mono',ui-monospace,Menlo,monospace;color:#000">
      <h1 style="font-size:22px;margin:0 0 12px">chikpixels did not start</h1>
      <p id="boot-reason" style="line-height:1.5;margin:0 0 12px"></p>
      <p id="boot-error" style="line-height:1.5;margin:0 0 12px;color:#5c5c5c;font-size:13px"></p>
      <button id="boot-reload" style="font:inherit;font-weight:500;padding:10px 16px;min-height:44px;border:2px solid #000;background:#fff;cursor:pointer">Reload</button>
    </div>
    <script>
      // If the app has not drawn anything after a few seconds, say why instead of leaving a blank page.
      ;(function () {
        var lastError = ''
        window.addEventListener('error', function (e) { lastError = e.message || 'A script failed to load' })
        window.addEventListener('unhandledrejection', function (e) { lastError = String((e.reason && e.reason.message) || e.reason || '') })
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root')
            if (root && root.firstChild) return
            var reason = location.protocol === 'file:'
              ? 'This page was opened straight from a file, and browsers block the app from running that way. Start it with "npm run dev" (or "npm run preview" after "npm run build") and open the address it prints.'
              : 'The app could not load. Reload the page. If it stays blank, hard-refresh (Cmd or Ctrl + Shift + R) or clear this site\'s data in your browser settings, since an old cached copy can cause this.'
            document.getElementById('boot-reason').textContent = reason
            document.getElementById('boot-error').textContent = lastError ? 'Error: ' + lastError : ''
            document.getElementById('boot-fallback').hidden = false
          }, 2500)
        })
        document.getElementById('boot-reload').addEventListener('click', function () { location.reload() })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
